<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Log in | Shree Pharma Dashboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/app/manifest.webmanifest">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f5f8;color:#13213a;font:16px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
main{width:100%;max-width:380px;background:#fff;border:1px solid #dde2e9;border-radius:16px;padding:28px 24px;box-shadow:0 1px 2px rgba(19,33,58,.05),0 10px 30px rgba(19,33,58,.06)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;margin-bottom:22px}
.logo i{width:9px;height:20px;background:#c8165e;border-radius:2px 2px 5px 5px;display:block}
h1{font-size:20px;margin:0 0 16px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;padding:12px;min-height:48px;border:1px solid #b6bfcb;border-radius:8px;font:inherit;font-size:16px}
input:focus{outline:none;border-color:#13213a;box-shadow:0 0 0 3px rgba(19,33,58,.14)}
:focus-visible{outline:3px solid #c8165e;outline-offset:2px}
button{width:100%;margin-top:16px;padding:13px;min-height:50px;font-size:16px!important;border:0;border-radius:8px;background:#c8165e;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#9c0f48}
.alert{border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px;font-weight:600}
.err{background:#fdecef;color:#a3122f}
.info{background:#fff3e0;color:#8a4b00;font-weight:500}
.show{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:500}
.show input{width:20px;height:20px;min-height:0}
.hint{margin:18px 0 0;font-size:13px;color:#5a6576}
</style>
</head>
<body>
<main>
  <div class="logo"><i></i>Shree Pharma</div>
  <h1>Log in to your dashboard</h1>
  {{NOTICE}}
  {{ERROR}}
  <form method="post" action="/app/login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <label class="show"><input type="checkbox" id="showpw"> Show password</label>
    <button type="submit">Log in</button>
  </form>
  <p class="hint">Forgot the password? Set a new one in Cloudflare: your Worker, then Settings, then Variables and Secrets, ADMIN_PASSWORD.</p>
</main>
<script>
document.getElementById('showpw').addEventListener('change', function () {
  document.getElementById('password').type = this.checked ? 'text' : 'password';
});
</script>
</body>
</html>
